<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rocky Attendance 🐻</title><style>
:root{font-family:system-ui,'Yu Gothic',sans-serif;color:#342b45;background:#faf5ff}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:15px;padding:12px 17px;font-weight:750}button:focus-visible,input:focus-visible{outline:3px solid #a97bdb}button.primary{background:#a77bdc;color:white}button.soft{background:#eee1fa;color:#64418c}button.danger{background:#ffe3e8;color:#a12d4a}.wrap{max-width:1040px;margin:auto;padding:22px 16px 70px}header{display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:clamp(25px,4vw,38px);margin:8px 0}h2{font-size:22px;margin:0 0 12px}.muted{color:#796b8a;font-size:14px}.hero{margin-top:20px;border-radius:30px;padding:22px;background:linear-gradient(135deg,#f1e2ff,#fff1f6);display:grid;grid-template-columns:minmax(160px,290px) 1fr;align-items:center;gap:20px}.bearbutton{background:none;padding:0;width:100%;height:235px;display:grid;place-items:center}.bear{width:210px;max-width:100%;filter:drop-shadow(0 14px 10px #7e5b9a35);animation:bob 2.3s ease-in-out infinite;transform-origin:bottom center}.bearbutton:active .bear{animation:jump .45s ease-out}.speech{background:white;border-radius:24px;padding:22px;font-size:19px;font-weight:700;box-shadow:0 6px 20px #7d5b9920}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}.stat,.panel,.item{background:white;border-radius:22px;padding:19px;box-shadow:0 4px 20px #846c9a12}.stat strong{display:block;font-size:32px;margin-top:6px}.panel{margin:20px 0}.panelhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.items{display:grid;gap:12px;margin-top:16px}.item{border:2px solid #eee6f4;box-shadow:none}.item.safe{border-left:8px solid #55bd90}.item.warn{border-left:8px solid #f3b94f}.item.bad{border-left:8px solid #e76882}.itemtop{display:flex;justify-content:space-between;gap:8px;align-items:start}.item h3{margin:0 0 6px;font-size:19px}.pill{display:inline-block;padding:5px 10px;border-radius:20px;background:#e7f8ee;color:#14794b;font-size:12px;font-weight:800}.warn .pill{background:#fff1d1;color:#926009}.bad .pill{background:#ffe3ea;color:#a52b4e}.actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}.actions button{padding:9px 12px;font-size:13px}.progress{height:10px;border-radius:20px;background:#eee8f5;overflow:hidden;margin:12px 0}.progress div{height:100%;background:#aa82dc;border-radius:20px}.empty{text-align:center;color:#857590;padding:28px}.dialog{position:fixed;inset:0;background:#2c1c3b99;display:none;align-items:center;justify-content:center;padding:14px;z-index:10}.dialog.open{display:flex}.modal{background:white;border-radius:25px;width:min(520px,100%);max-height:90vh;overflow:auto;padding:25px}.field{display:grid;gap:6px;margin:13px 0}.field label{font-weight:700}.field input,.field select{width:100%;border:2px solid #e5d8ef;border-radius:13px;padding:13px;color:#2c2434;background:white}.modalbuttons{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#39264e;color:white;border-radius:14px;padding:12px 20px;display:none;z-index:20;max-width:90vw}.toast.show{display:block}.note{font-size:12px;color:#786a88;margin-top:10px}@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-15px) rotate(3deg)}}@keyframes jump{50%{transform:translateY(-42px) rotate(8deg)}}@media(max-width:650px){.hero{grid-template-columns:1fr;text-align:center}.bearbutton{height:190px}.bear{width:170px}.stats{grid-template-columns:repeat(2,1fr)}.speech{font-size:16px}}
</style></head><body><main class="wrap"><header><div><div class="muted">🐻 いっしょに単位を守ろう</div><h1>Rocky Attendance ♡</h1></div><button class="soft" id="notifyBtn" type="button">🔔 通知を許可</button></header><section class="hero"><button class="bearbutton" id="bearBtn" type="button" aria-label="ロッキーと話す"><svg class="bear" viewBox="0 0 250 250" xmlns="http://www.w3.org/2000/svg"><ellipse cx="125" cy="230" rx="77" ry="12" fill="#aa85c5" opacity=".18"/><circle cx="64" cy="59" r="37" fill="#b9845d"/><circle cx="186" cy="59" r="37" fill="#b9845d"/><circle cx="64" cy="59" r="20" fill="#e7bba5"/><circle cx="186" cy="59" r="20" fill="#e7bba5"/><ellipse cx="125" cy="155" rx="87" ry="86" fill="#bb8964"/><circle cx="125" cy="106" r="88" fill="#c99872"/><ellipse cx="125" cy="136" rx="45" ry="34" fill="#f3d9bf"/><circle cx="92" cy="105" r="8" fill="#332636"/><circle cx="158" cy="105" r="8" fill="#332636"/><ellipse cx="125" cy="124" rx="13" ry="10" fill="#543b40"/><path d="M111 145 Q125 160 139 145" fill="none" stroke="#543b40" stroke-width="5" stroke-linecap="round"/><circle cx="75" cy="133" r="12" fill="#f1a5a9" opacity=".65"/><circle cx="175" cy="133" r="12" fill="#f1a5a9" opacity=".65"/><ellipse cx="125" cy="201" rx="44" ry="30" fill="#f3d9bf"/><path d="M105 195 Q125 178 145 195 Q148 213 125 223 Q102 213 105 195" fill="#e38ea7"/><ellipse cx="55" cy="196" rx="25" ry="32" fill="#bb8964" transform="rotate(25 55 196)"/><ellipse cx="195" cy="196" rx="25" ry="32" fill="#bb8964" transform="rotate(-25 195 196)"/></svg></button><div><div class="speech" id="speech" aria-live="polite">やっほー！ぼくロッキー🐻 授業と課題を登録してね！</div><p class="muted">ロッキーをタップするとおしゃべりするよ ♡</p><button class="soft" id="voiceBtn" type="button">🔊 音声 ON</button></div></section><div class="stats"><div class="stat"><span class="muted">登録授業</span><strong id="sClasses">0</strong></div><div class="stat"><span class="muted">出席回数</span><strong id="sAttend">0</strong></div><div class="stat"><span class="muted">欠席換算</span><strong id="sAbsent">0</strong></div><div class="stat"><span class="muted">未完了課題</span><strong id="sTasks">0</strong></div></div><section class="panel"><div class="panelhead"><div><h2>📚 授業の出席管理</h2><div class="muted">遅刻2回 = 欠席1回として計算</div></div><button class="primary" id="addClass" type="button">＋ 授業を追加</button></div><div id="classList" class="items"></div></section><section class="panel"><div class="panelhead"><div><h2>📝 課題の締め切り</h2><div class="muted">24時間前・1時間前にお知らせ</div></div><button class="primary" id="addTask" type="button">＋ 課題を追加</button></div><div id="taskList" class="items"></div><p class="note">※アプリを開いている間に締め切りをチェックします。ブラウザ通知は許可した場合のみ表示されます。ブラウザを閉じている間の通知には対応していません。</p></section></main><div id="dialog" class="dialog" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal"><h2 id="modalTitle"></h2><form id="entryForm" novalidate><div id="fields"></div><div class="modalbuttons"><button class="soft" id="cancel" type="button">キャンセル</button><button class="primary" id="save" type="submit">保存する</button></div></form></div></div><div id="toast" class="toast" role="status"></div><script>
'use strict';
(function(){
const $=id=>document.getElementById(id),KEY='rocky_attendance_v3';let state={classes:[],tasks:[]},mode='',editing=null,voice=true;
try{let old=JSON.parse(localStorage.getItem(KEY)||'null');if(old&&Array.isArray(old.classes)&&Array.isArray(old.tasks))state=old}catch(e){}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch(e){toast('このブラウザでは保存が制限されています');return false}}
function toast(s){$('toast').textContent=s;$('toast').classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').classList.remove('show'),3200)}
function say(s){$('speech').textContent=s;if(voice&&'speechSynthesis'in window){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(s.replace(/[🐻♡💜！]/g,''));u.lang='ja-JP';u.rate=1.08;u.pitch=1.25;speechSynthesis.speak(u)}catch(e){}}}
function el(tag,txt,cls){let x=document.createElement(tag);if(txt!==undefined)x.textContent=txt;if(cls)x.className=cls;return x}
function button(txt,cls,fn){let b=el('button',txt,cls);b.type='button';b.addEventListener('click',fn);return b}
function remaining(c){return c.total-c.required-c.absent-Math.floor(c.late/2)}
function level(c){let r=remaining(c);return r<=0?'bad':r<=2?'warn':'safe'}
function render(){let ca=$('classList'),ta=$('taskList');ca.replaceChildren();ta.replaceChildren();$('sClasses').textContent=state.classes.length;$('sAttend').textContent=state.classes.reduce((n,c)=>n+c.attend,0);$('sAbsent').textContent=state.classes.reduce((n,c)=>n+c.absent+Math.floor(c.late/2),0);$('sTasks').textContent=state.tasks.filter(t=>!t.done).length;
if(!state.classes.length)ca.append(el('div','まだ授業がないよ。右上から追加してね！','empty'));
state.classes.forEach(c=>{let r=remaining(c),l=level(c),box=el('article',undefined,'item '+l),top=el('div',undefined,'itemtop'),left=el('div');left.append(el('h3',c.name),el('div',`出席 ${c.attend}回 ／ 欠席 ${c.absent}回 ／ 遅刻 ${c.late}回`,'muted'));top.append(left,el('span',r<0?'必要出席に届かない可能性':r===0?'もう欠席できない':`あと${r}回欠席OK`,'pill'));box.append(top);let p=el('div',undefined,'progress'),bar=el('div');bar.style.width=Math.min(100,Math.max(0,c.attend/c.required*100))+'%';p.append(bar);box.append(p,el('div',`必要出席 ${c.required}回 ／ 全${c.total}回　・　あと${Math.max(0,c.required-c.attend)}回の出席が必要`,'muted'));let a=el('div',undefined,'actions');a.append(button('＋出席','soft',()=>change(c.id,'attend',1)),button('＋欠席','soft',()=>change(c.id,'absent',1)),button('＋遅刻','soft',()=>change(c.id,'late',1)),button('編集','soft',()=>openForm('class',c.id)),button('取り消し','soft',()=>undo(c.id)),button('削除','danger',()=>remove('class',c.id)));box.append(a);ca.append(box)});
if(!state.tasks.length)ta.append(el('div','課題を追加するとロッキーがお知らせするよ！','empty'));
state.tasks.slice().sort((a,b)=>a.due.localeCompare(b.due)).forEach(t=>{let d=new Date(t.due),diff=d-Date.now(),box=el('article',undefined,'item '+(t.done?'safe':diff<0?'bad':diff<=3600000?'bad':diff<=86400000?'warn':'safe'));let top=el('div',undefined,'itemtop'),left=el('div');left.append(el('h3',t.title),el('div',(t.subject?t.subject+' ・ ':'')+d.toLocaleString('ja-JP',{year:'numeric',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}),'muted'));top.append(left,el('span',t.done?'完了':diff<0?'期限切れ':diff<=3600000?'1時間以内':diff<=86400000?'24時間以内':'予定あり','pill'));box.append(top);let a=el('div',undefined,'actions');a.append(button(t.done?'未完了に戻す':'✓ 完了','soft',()=>{t.done=!t.done;persist();render();say(t.done?'課題おつかれさま！':'また一緒に頑張ろう！')}),button('編集','soft',()=>openForm('task',t.id)),button('削除','danger',()=>remove('task',t.id)));box.append(a);ta.append(box)})}
function change(id,k,n){let c=state.classes.find(x=>x.id===id);if(!c)return;if(c.attend+c.absent+c.late>=c.total){toast('全授業回数に達しているよ。編集で調整してね');return}c[k]+=n;persist();render();say(remaining(c)<=0?'気をつけて！この授業はもう欠席できないよ！':k==='attend'?'出席えらい！この調子だよ！':'記録したよ！残りの欠席回数を確認してね！')}
function undo(id){let c=state.classes.find(x=>x.id===id);if(!c)return;for(let k of ['late','absent','attend']){if(c[k]>0){c[k]--;persist();render();toast('直近の種類を1回減らしたよ（遅刻→欠席→出席の順）');return}}toast('取り消せる記録がないよ')}
function remove(type,id){if(!confirm('本当に削除する？'))return;let key=type==='class'?'classes':'tasks';state[key]=state[key].filter(x=>x.id!==id);persist();render();toast('削除したよ')}
function field(name,label,type,value,required=true){let d=el('div',undefined,'field'),lab=el('label',label),input=el('input');input.name=name;input.id='f_'+name;input.type=type;input.value=value??'';input.required=required;if(type==='number'){input.min='0';input.step='1'}lab.htmlFor=input.id;d.append(lab,input);return d}
function openForm(m,id=null){mode=m;editing=id;let item=id?state[m==='class'?'classes':'tasks'].find(x=>x.id===id):null;$('modalTitle').textContent=(id?'編集：':'追加：')+(m==='class'?'授業':'課題');let f=$('fields');f.replaceChildren();if(m==='class'){f.append(field('name','授業名','text',item?.name||''),field('total','全授業回数','number',item?.total??14),field('required','必要出席回数','number',item?.required??10),field('attend','出席回数','number',item?.attend??0),field('absent','欠席回数','number',item?.absent??0),field('late','遅刻回数','number',item?.late??0))}else{let local=new Date(Date.now()+86400000);local=new Date(local.getTime()-local.getTimezoneOffset()*60000).toISOString().slice(0,16);f.append(field('title','課題名','text',item?.title||''),field('subject','授業名（任意）','text',item?.subject||'',false),field('due','締め切り','datetime-local',item?.due||local))}$('dialog').classList.add('open');setTimeout(()=>f.querySelector('input')?.focus(),40)}
function closeForm(){$('dialog').classList.remove('open');$('entryForm').reset();mode='';editing=null}
$('entryForm').addEventListener('submit',function(e){e.preventDefault();try{const f=new FormData(this),v=k=>String(f.get(k)||'').trim();if(mode==='class'){let name=v('name'),nums=['total','required','attend','absent','late'].map(k=>Number(v(k)));if(!name){toast('授業名を入力してね');$('f_name').focus();return}if(nums.some(x=>!Number.isInteger(x)||x<0)||nums[0]<1||nums[1]<1||nums[1]>nums[0]){toast('授業回数・必要出席回数を確認してね');return}if(nums[2]+nums[3]+nums[4]>nums[0]){toast('記録回数の合計が全授業回数を超えているよ');return}let obj={id:editing||String(Date.now())+Math.random(),name,total:nums[0],required:nums[1],attend:nums[2],absent:nums[3],late:nums[4]};if(editing)state.classes=state.classes.map(x=>x.id===editing?obj:x);else state.classes.push(obj)}else if(mode==='task'){if(!v('title')||!v('due')){toast('課題名と締め切りを入力してね');return}let obj={id:editing||String(Date.now())+Math.random(),title:v('title'),subject:v('subject'),due:v('due'),done:editing?(state.tasks.find(x=>x.id===editing)?.done||false):false,alert24:false,alert1:false};if(editing)state.tasks=state.tasks.map(x=>x.id===editing?obj:x);else state.tasks.push(obj)}else return;persist();closeForm();render();toast('保存できたよ！');say('保存できたよ！いっしょに頑張ろうね！')}catch(err){console.error(err);toast('保存中にエラーが発生したよ：'+err.message)}});
$('addClass').addEventListener('click',()=>openForm('class'));$('addTask').addEventListener('click',()=>openForm('task'));$('cancel').addEventListener('click',closeForm);$('dialog').addEventListener('click',e=>{if(e.target===$('dialog'))closeForm()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeForm()});$('bearBtn').addEventListener('click',()=>{let danger=state.classes.find(c=>remaining(c)<=0),due=state.tasks.find(t=>!t.done&&new Date(t.due)-Date.now()<86400000);say(danger?`${danger.name}はもう欠席できないよ！出席を頑張ろう！`:due?`${due.title}の締め切りが近いよ！`:state.classes.length?'今日も頑張っててえらい！ぼくが見守ってるよ！':'やっほー！まずは授業を追加してみてね！')});$('voiceBtn').addEventListener('click',()=>{voice=!voice;$('voiceBtn').textContent=voice?'🔊 音声 ON':'🔇 音声 OFF';if(!voice&&'speechSynthesis'in window)speechSynthesis.cancel();toast(voice?'音声をオンにしたよ':'音声をオフにしたよ')});$('notifyBtn').addEventListener('click',async()=>{if(!('Notification'in window)){toast('このブラウザは通知に対応していないよ');return}try{let result=await Notification.requestPermission();toast(result==='granted'?'通知を許可したよ！':'通知が許可されなかったよ')}catch(e){toast('通知を設定できなかったよ')}});
function checkDeadlines(){let dirty=false;state.tasks.forEach(t=>{if(t.done)return;let diff=new Date(t.due)-Date.now();for(let [hours,key] of [[24,'alert24'],[1,'alert1']]){if(diff>0&&diff<=hours*3600000&&!t[key]){t[key]=true;dirty=true;let msg=`ロッキーからのお知らせ！「${t.title}」の締め切りまで${hours===1?'1時間以内':'24時間以内'}だよ！`;say(msg);toast(msg);if('Notification'in window&&Notification.permission==='granted'){try{new Notification('🐻 Rocky Attendance',{body:msg})}catch(e){}}}}});if(dirty)persist()}
render();checkDeadlines();setInterval(checkDeadlines,30000);
})();
</script></body></html>
