<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>出席管理アプリ</title><link rel="stylesheet" href="style.css"></head><body><main class="wrap"><header><div><div class="muted">MY CLASS NOTE  /  2026</div><h1>出席管理アプリ</h1></div><button class="soft" id="notifyBtn" type="button">🔔 通知を許可</button></header><div class="danger-banner" id="dangerBanner" role="status" aria-live="polite"><span id="dangerSymbol">●</span><span id="dangerText">出席状況を確認中</span><button id="effectsBtn" type="button" class="soft" aria-pressed="true">演出 ON</button></div><section class="hero"><button class="bearbutton" id="bearBtn" type="button" aria-label="ロッキーと話す"><svg class="bear" viewBox="0 0 250 250" xmlns="http://www.w3.org/2000/svg"><ellipse cx="125" cy="230" rx="77" ry="12" fill="#aa85c5" opacity=".18"/><circle cx="64" cy="59" r="37" fill="#b9845d"/><circle cx="186" cy="59" r="37" fill="#b9845d"/><circle cx="64" cy="59" r="20" fill="#e7bba5"/><circle cx="186" cy="59" r="20" fill="#e7bba5"/><ellipse cx="125" cy="155" rx="87" ry="86" fill="#bb8964"/><circle cx="125" cy="106" r="88" fill="#c99872"/><ellipse cx="125" cy="136" rx="45" ry="34" fill="#f3d9bf"/><circle cx="92" cy="105" r="8" fill="#332636"/><circle cx="158" cy="105" r="8" fill="#332636"/><ellipse cx="125" cy="124" rx="13" ry="10" fill="#543b40"/><path d="M111 145 Q125 160 139 145" fill="none" stroke="#543b40" stroke-width="5" stroke-linecap="round"/><circle cx="75" cy="133" r="12" fill="#f1a5a9" opacity=".65"/><circle cx="175" cy="133" r="12" fill="#f1a5a9" opacity=".65"/><ellipse cx="125" cy="201" rx="44" ry="30" fill="#f3d9bf"/><path d="M105 195 Q125 178 145 195 Q148 213 125 223 Q102 213 105 195" fill="#e38ea7"/><ellipse cx="55" cy="196" rx="25" ry="32" fill="#bb8964" transform="rotate(25 55 196)"/><ellipse cx="195" cy="196" rx="25" ry="32" fill="#bb8964" transform="rotate(-25 195 196)"/><g class="monster-face"><path d="M73 91 L111 105 L83 113 Z M177 91 L139 105 L167 113 Z" fill="#300507"/><path d="M100 146 Q125 178 150 146 L143 169 L135 157 L125 175 L115 157 L107 169 Z" fill="#410509" stroke="#260003" stroke-width="3"/><path d="M89 79 L113 93 M161 79 L137 93" stroke="#470508" stroke-width="8" stroke-linecap="round"/><circle cx="92" cy="105" r="11" fill="#ff1c2b"/><circle cx="158" cy="105" r="11" fill="#ff1c2b"/><circle cx="92" cy="105" r="4" fill="white"/><circle cx="158" cy="105" r="4" fill="white"/></g></svg></button><div><div class="speech" id="speech" aria-live="polite">やっほー！ロッキーだよ。今日も一緒にがんばろう！</div><p class="muted">ロッキーを押すと、今日のひとことを話すよ。</p><button class="soft" id="voiceBtn" type="button">🔊 音声 ON</button> <button class="soft" id="sampleVoiceBtn" type="button">♪ 今の声を試す</button><p class="muted voice-note">声は危険度で自動切替。端末によって声質は異なります。</p></div></section><div class="stats"><div class="stat"><span class="muted">登録授業</span><strong id="sClasses">0</strong></div><div class="stat"><span class="muted">出席回数</span><strong id="sAttend">0</strong></div><div class="stat"><span class="muted">欠席換算</span><strong id="sAbsent">0</strong></div><div class="stat"><span class="muted">未完了課題</span><strong id="sTasks">0</strong></div></div><section class="panel"><div class="panelhead"><div><h2>01 / 授業の記録</h2><div class="muted">遅刻2回 = 欠席1回として計算</div></div><button class="primary" id="addClass" type="button">＋ 授業を追加</button></div><div id="classList" class="items"></div></section><section class="panel"><div class="panelhead"><div><h2>02 / 課題の締め切り</h2><div class="muted">24時間前・1時間前にお知らせ</div></div><button class="primary" id="addTask" type="button">＋ 課題を追加</button></div><div id="taskList" class="items"></div><p class="note">※アプリを開いている間に締め切りをチェックします。ブラウザ通知は許可した場合のみ表示されます。ブラウザを閉じている間の通知には対応していません。</p></section></main><div id="dialog" class="dialog" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal"><h2 id="modalTitle"></h2><form id="entryForm" novalidate><div id="fields"></div><div class="modalbuttons"><button class="soft" id="cancel" type="button">キャンセル</button><button class="primary" id="save" type="submit">保存する</button></div></form></div></div><div id="toast" class="toast" role="status"></div><script src="script.js" defer></script></body></html>
