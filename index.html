<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ROCKY CAMPUS ♡</title><link rel="stylesheet" href="./style.css"></head><body><main class="wrap"><header><div class="eyebrow">♡ YOUR CAMPUS BUDDY ♡</div><h1>ROCKY <span>CAMPUS</span></h1><p>くまちゃんと一緒に、単位を守ろう！</p></header><section class="hero"><div class="speech" id="speech" aria-live="polite">やっほー！今日も一緒にがんばろう♡</div><button class="bear-zone" id="bearButton" aria-label="くまちゃんに話しかける"><div class="bear" id="bear"><div class="ear left"></div><div class="ear right"></div><div class="body"><div class="belly"></div><div class="arm left"></div><div class="arm right"></div><div class="foot left"></div><div class="foot right"></div></div><div class="head"><div class="bow">🎀</div><div class="eye left"></div><div class="eye right"></div><div class="blush left"></div><div class="blush right"></div><div class="muzzle"><div class="nose"></div><div class="mouth">ᴗ</div></div></div></div></button><div class="hero-bottom"><div><b id="mood">ごきげん ♡</b><small>ロッキーのきもち</small></div><div><b id="level">Lv. 1</b><small>経験値 <span id="xp">0</span>/50</small></div><button class="small-btn" id="voiceButton">🔊 声 ON</button></div></section><section class="stats"><div class="stat"><small>登録授業</small><strong id="subjectCount">0</strong></div><div class="stat"><small>出席合計</small><strong id="attendTotal">0</strong></div><div class="stat"><small>課題の残り</small><strong id="taskCount">0</strong></div></section><section class="panel"><div class="section-head"><h2>📚 授業の出席管理</h2></div><form id="subjectForm" class="form-grid"><label>授業名<input id="subjectName" placeholder="例：データサイエンス" required maxlength="40"></label><label>授業回数<input id="totalClasses" type="number" min="1" max="100" value="14" required></label><label>必要出席率（%）<input id="requiredPercent" type="number" min="1" max="100" value="67" required></label><button class="primary" type="submit">＋ 授業を追加</button></form><div id="subjectList" class="items"></div></section><section class="panel"><div class="section-head"><h2>💌 課題と締め切り</h2><button id="notificationButton" class="small-btn">🔔 通知を許可</button></div><p class="hint">締め切り24時間前・1時間前にお知らせ。ブラウザを開いている間にチェックします。</p><form id="taskForm" class="form-grid"><label>課題名<input id="taskName" placeholder="例：英語プレゼン" required maxlength="60"></label><label>締め切り<input id="taskDeadline" type="datetime-local" required></label><button class="primary" type="submit">＋ 課題を追加</button></form><div id="taskList" class="items"></div></section><footer>made with ♡ by ROCKY CAMPUS · データはこのブラウザに保存されます</footer></main><script src="./script.js" defer></script></body></html>
